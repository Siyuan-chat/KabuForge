<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc">
  <title id="title">KabuForge research pipeline</title>
  <desc id="desc">A local-first Japanese equity quantitative research pipeline from J-Quants or local data through factor and machine-learning research, backtesting, portfolio and risk, to broker-neutral planning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#202832"/>
      <stop offset="100%" stop-color="#151b22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1280" height="600" rx="28" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="8" rx="4" fill="#ff7a2d"/>

  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="72" y="92" fill="#ffad76" font-size="18" font-weight="700" letter-spacing="3">KABUFORGE</text>
    <text x="72" y="148" fill="#f7f9fb" font-size="42" font-weight="760">Japanese equity research, forged into one inspectable pipeline.</text>
    <text x="72" y="188" fill="#c7d0d8" font-size="20">Local-first · reproducible · research-only · agent-compatible</text>

    <g transform="translate(72 242)" filter="url(#shadow)">
      <rect width="208" height="164" rx="16" fill="#29333e" stroke="#465362"/>
      <text x="24" y="34" fill="#ffad76" font-size="13" font-weight="750" letter-spacing="1.6">01 · INPUT</text>
      <text x="24" y="79" fill="#ffffff" font-size="24" font-weight="700">J-Quants</text>
      <text x="24" y="111" fill="#ffffff" font-size="24" font-weight="700">/ local data</text>
      <text x="24" y="143" fill="#aeb9c4" font-size="14">Explicit user-selected inputs</text>
    </g>

    <g transform="translate(304 242)" filter="url(#shadow)">
      <rect width="208" height="164" rx="16" fill="#29333e" stroke="#465362"/>
      <text x="24" y="34" fill="#ffad76" font-size="13" font-weight="750" letter-spacing="1.6">02 · RESEARCH</text>
      <text x="24" y="79" fill="#ffffff" font-size="24" font-weight="700">Factor + ML</text>
      <text x="24" y="111" fill="#ffffff" font-size="24" font-weight="700">research</text>
      <text x="24" y="143" fill="#aeb9c4" font-size="14">Versioned contracts</text>
    </g>

    <g transform="translate(536 242)" filter="url(#shadow)">
      <rect width="208" height="164" rx="16" fill="#29333e" stroke="#465362"/>
      <text x="24" y="34" fill="#ffad76" font-size="13" font-weight="750" letter-spacing="1.6">03 · TEST</text>
      <text x="24" y="79" fill="#ffffff" font-size="24" font-weight="700">Historical</text>
      <text x="24" y="111" fill="#ffffff" font-size="24" font-weight="700">backtest</text>
      <text x="24" y="143" fill="#aeb9c4" font-size="14">Explicit execution semantics</text>
    </g>

    <g transform="translate(768 242)" filter="url(#shadow)">
      <rect width="208" height="164" rx="16" fill="#29333e" stroke="#465362"/>
      <text x="24" y="34" fill="#ffad76" font-size="13" font-weight="750" letter-spacing="1.6">04 · DECIDE</text>
      <text x="24" y="79" fill="#ffffff" font-size="24" font-weight="700">Portfolio</text>
      <text x="24" y="111" fill="#ffffff" font-size="24" font-weight="700">+ risk</text>
      <text x="24" y="143" fill="#aeb9c4" font-size="14">Targets and constraints</text>
    </g>

    <g transform="translate(1000 242)" filter="url(#shadow)">
      <rect width="208" height="164" rx="16" fill="#29333e" stroke="#465362"/>
      <text x="24" y="34" fill="#ffad76" font-size="13" font-weight="750" letter-spacing="1.6">05 · PLAN</text>
      <text x="24" y="79" fill="#ffffff" font-size="24" font-weight="700">Broker-neutral</text>
      <text x="24" y="111" fill="#ffffff" font-size="24" font-weight="700">planning</text>
      <text x="24" y="143" fill="#aeb9c4" font-size="14">Submit / cancel disabled</text>
    </g>

    <g fill="#ff7a2d">
      <path d="M286 321h12l-7-7 5-5 16 16-16 16-5-5 7-7h-12z"/>
      <path d="M518 321h12l-7-7 5-5 16 16-16 16-5-5 7-7h-12z"/>
      <path d="M750 321h12l-7-7 5-5 16 16-16 16-5-5 7-7h-12z"/>
      <path d="M982 321h12l-7-7 5-5 16 16-16 16-5-5 7-7h-12z"/>
    </g>

    <g transform="translate(72 466)">
      <rect width="1136" height="76" rx="14" fill="#171e26" stroke="#3d4956"/>
      <circle cx="34" cy="38" r="8" fill="#ff7a2d"/>
      <text x="54" y="44" fill="#e9edf1" font-size="17" font-weight="650">Python · CLI · Desktop GUI · MCP agents</text>
      <text x="474" y="44" fill="#8e9aa6" font-size="16">shared application services</text>
      <text x="1110" y="44" fill="#ffad76" font-size="14" font-weight="700" text-anchor="end">RESEARCH &amp; LOCAL SIMULATION</text>
    </g>
  </g>
</svg>