name: Feature request
description: Propose a research workflow or interface improvement
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic or license-permitted minimal examples. Do not include credentials, account records, or private data.
        For security vulnerabilities follow [SECURITY.md](https://github.com/Siyuan-chat/KabuForge/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Package version or commit / 版本或提交 / バージョンまたはコミット
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境 / 環境
      description: OS, Python version, interface (Python / CLI / GUI / MCP).
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use case / 使用场景 / ユースケース
      description: Who needs this and what decision does it support?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and current behavior / 预期与现状 / 期待と現状
      description: State the desired outcome and current limitation.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal example / 最小示例 / 最小例
      description: Public or synthetic example of the workflow.
    validations:
      required: true
