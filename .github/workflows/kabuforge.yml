name: KabuForge Release Foundation
on: [push, pull_request, workflow_dispatch]
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1
      - run: python -m pip install -e '.[gui]' build
      - run: python -m unittest discover -s framework_v2/tests -p 'test_*.py' -q
      - run: python tools/check_docs.py
      - run: python -m build
      - run: kabuforge demo --out output/ci_demo
      - run: kabuforge strategies
  gui:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[gui]'
      - run: python -m unittest framework_v2.tests.test_workbench_qt framework_v2.tests.test_product_ui -q
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv /tmp/kabuforge-clean
      - run: /tmp/kabuforge-clean/bin/python -c "import glob,subprocess,sys; subprocess.run([sys.executable,'-m','pip','install',glob.glob('dist/*.whl')[0]+'[gui]'],check=True)"
      - run: cd /tmp && /tmp/kabuforge-clean/bin/kabuforge demo --out /tmp/kabuforge-demo
      - run: cd /tmp && /tmp/kabuforge-clean/bin/python "$GITHUB_WORKSPACE/tools/check_installed_package.py"
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest framework_v2.tests.test_agent framework_v2.tests.test_research_diagnostics -q
      - run: python tools/check_agent_catalog.py
  # Public artifacts are audited on every PR and push, before a release tag.
  public-distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - run: python tools/check_public_distribution.py .
      - run: python tools/check_public_distribution.py dist/*.whl
      - run: python tools/check_public_distribution.py dist/*.tar.gz
