name: Documentation
description: Report missing, incorrect or unclear documentation
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic or license-permitted minimal examples. Do not include credentials, account records, or private data.
        For security vulnerabilities follow [SECURITY.md](https://github.com/Siyuan-chat/KabuForge/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Package version or commit / 版本或提交 / バージョンまたはコミット
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境 / 環境
      description: OS, Python version, interface (Python / CLI / GUI / MCP).
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Page and locale / 页面与语言 / ページと言語
      description: Link the page and section.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual guidance / 预期与实际说明 / 期待と実際の説明
      description: Propose precise wording where possible.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction or reading path / 最小复现或阅读路径 / 再現または読書経路
      description: Commands for broken examples or links for confusing navigation.
    validations:
      required: true
