name: Website validation
on:
  push:
    paths: ['website/**', 'pyproject.toml', 'tools/sync_version.py', 'README.md', 'README.zh_CN.md', 'README.ja_JP.md', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', 'pyproject.toml', 'tools/sync_version.py', 'README.md', 'README.zh_CN.md', 'README.ja_JP.md', '.github/workflows/website.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check shared version sources
        working-directory: .
        run: python tools/sync_version.py --check
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run check
